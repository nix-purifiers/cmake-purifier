# SPDX-License-Identifier: MIT
#
# The checks of every push and pull request run natively on x86_64-linux,
# aarch64-linux, and GitHub's aarch64-darwin runner.
#
# - `flake-check` builds every flake check, the `conformance-*` checks
#   that run in the sandbox among them, and evaluates the checks of both
#   systems.
# - `conformance-relock` relocks the fixtures with the network and fails
#   when a lockfile changes: the lock run must reproduce the committed
#   lockfiles byte for byte.
# - `conformance-rebuild` builds fixtures again with `nix build --rebuild`,
#   which fails when the second build differs from the first.
# - `conformance-offline` prefetches the fixtures and runs their everyday
#   loop in a network namespace without a network (tests/offline.sh).
# - `conformance-update` locks a project that follows two git branches,
#   moves the branches, and checks that `lock` keeps the locked commits
#   and `update` moves them (tests/update.sh).
# - `commands` runs tests/negative.sh: the errors of the command, a
#   lockfile kept outside the project, and `publish`.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        job: [flake-check, conformance-relock, conformance-rebuild, conformance-offline, conformance-update, commands]
    name: ${{ matrix.job }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Record the native platform and source
        run: |
          git rev-parse HEAD
          sandbox=$(nix config show sandbox)
          echo "Nix sandbox: $sandbox"
          test "$sandbox" = true
          uname -a
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          echo "Nix system: $system"
          if [ "${{ matrix.runner }}" = macos-15 ]; then
            test "$system" = aarch64-darwin
            test "$(uname -m)" = arm64
          fi
      - name: Build the flake checks
        if: matrix.job == 'flake-check'
        run: |
          nix flake check --option sandbox true --option allow-import-from-derivation false -L
          nix flake check --all-systems --no-build
      - name: Relock the fixtures and compare
        if: matrix.job == 'conformance-relock'
        run: |
          tests/relock-fixtures.sh
          git diff --exit-code -- tests/fixtures tests/real-world
      - name: Build fixtures twice and compare
        if: matrix.job == 'conformance-rebuild'
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          for fixture in basic extras vcs; do
            nix build -L --no-link ".#checks.$system.$fixture"
            nix build -L --no-link --rebuild ".#checks.$system.$fixture"
          done
      - name: Run the development loop offline
        if: matrix.job == 'conformance-offline'
        run: |
          # Ubuntu's AppArmor stops unprivileged user namespaces, which
          # unshare needs for the namespace without a network.
          if [ "$(uname -s)" = Linux ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # The fetches of the vcs and cvs fixtures read their repositories
          # from the store, where the flake checks `vcs` and `cvs` put them.
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --no-link ".#checks.$system.vcs" ".#checks.$system.cvs"
          CMAKE_PURIFIER_REQUIRE_OFFLINE=1 tests/offline.sh
      - name: Update a project whose branches moved
        if: matrix.job == 'conformance-update'
        run: tests/update.sh
      - name: Run the command tests
        if: matrix.job == 'commands'
        run: tests/negative.sh

  supported-toolchains:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
        version: [3.31.12, 4.3.6, 4.4.5, 4.5.0-rc3]
    name: CMake ${{ matrix.version }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Verify platform and exercise the selected SDK
        env:
          CMAKE_PURIFIER_REQUIRE_OFFLINE: 1
        run: |
          git rev-parse HEAD
          sandbox=$(nix config show sandbox)
          echo "Nix sandbox: $sandbox"
          test "$sandbox" = true
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [ "${{ matrix.runner }}" = macos-15 ]; then
            test "$system" = aarch64-darwin
            test "$(uname -m)" = arm64
          else
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          tests/toolchains/check.sh '${{ matrix.version }}'
          key=$(echo '${{ matrix.version }}' | tr . _)
          nix build --option sandbox true --option allow-import-from-derivation false --no-link -L ".#checks.$system.sdk-basic-$key"
          nix derivation show ".#checks.$system.sdk-basic-$key"
          nix path-info --json ".#checks.$system.sdk-basic-$key"

  independent-sample:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    name: spdlog lifecycle (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Lock, prefetch, test offline, and switch installed consumers
        env:
          CMAKE_PURIFIER_REQUIRE_OFFLINE: 1
        run: |
          git rev-parse HEAD
          sandbox=$(nix config show sandbox)
          echo "Nix sandbox: $sandbox"
          test "$sandbox" = true
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [ "${{ matrix.runner }}" = macos-15 ]; then
            test "$system" = aarch64-darwin
            test "$(uname -m)" = arm64
          else
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          tests/real-world/spdlog/check.sh
          nix build --option sandbox true --option allow-import-from-derivation false --no-link -L ".#checks.$system.real-world-spdlog-consumer"
          nix derivation show ".#checks.$system.real-world-spdlog-consumer"
          nix path-info --json ".#checks.$system.real-world-spdlog-consumer"
